<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三角関数のグラフ ― 単位円から y = sinθ, y = cosθ へ</title>
<style>
/* ------------------------------------------------------------------
   明るい教室でのプロジェクタ投影を前提に、白背景のみで組んでいる。
   canvas の描画色は JS 側の C と対応させているため、片方だけ変えないこと。
   --s は文字サイズの倍率。投影時に 1.3 / 1.6 へ上げて後方の席から読ませる。
------------------------------------------------------------------- */
:root{
  --s:1;
  --bg:#ffffff; --panel:#f5f7fa; --edge:#d3dae4;
  --fg:#12181f; --sub:#5a6675;
  --sin:#0b62c4; --cos:#c2560a; --t:#0f7a3d;
  --btn:#ffffff; --btn-edge:#c3ccd8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:calc(15px * var(--s));line-height:1.5}

.bar{display:flex;align-items:center;gap:calc(12px * var(--s));flex-wrap:wrap;
  padding:calc(9px * var(--s)) calc(14px * var(--s));border-bottom:1px solid var(--edge);
  background:var(--panel)}
h1{font-size:calc(17px * var(--s));margin:0;white-space:nowrap;font-weight:700}

/* sin / cos の切り替え。今どちらを見ているかが一目で分かるよう色で示す */
.tabs{display:flex;gap:calc(4px * var(--s));background:var(--btn);
  border:1px solid var(--btn-edge);border-radius:10px;padding:calc(3px * var(--s))}
.tabs button{border:none;background:transparent;color:var(--sub);cursor:pointer;
  font-family:inherit;font-size:calc(16px * var(--s));font-weight:700;
  padding:calc(6px * var(--s)) calc(18px * var(--s));border-radius:8px}
.tabs button.on{color:#fff}
.tabs button.on[data-m="sin"]{background:var(--sin)}
.tabs button.on[data-m="cos"]{background:var(--cos)}

.tools{display:flex;gap:calc(7px * var(--s));margin-left:auto;flex-wrap:wrap}
button.tool{background:var(--btn);color:var(--fg);border:1px solid var(--btn-edge);
  border-radius:9px;padding:calc(7px * var(--s)) calc(11px * var(--s));
  font-size:calc(13px * var(--s));font-family:inherit;cursor:pointer}
button.tool:hover{border-color:var(--sin)}
button.tool.on{background:var(--t);color:#fff;border-color:var(--t);font-weight:700}

main{padding:calc(10px * var(--s))}
canvas{width:100%;height:clamp(300px,70vh,820px);display:block;
  background:var(--panel);border:1px solid var(--edge);border-radius:12px;touch-action:none}
@media (max-height:520px){
  .bar{padding:calc(5px * var(--s)) calc(10px * var(--s))}
  h1{font-size:calc(15px * var(--s))}
  main{padding:calc(7px * var(--s))}
  canvas{height:calc(100vh - 140px);min-height:190px}
}

/* 値の表示。読み上げながら板書と対応させるため大きめに出す */
.readout{display:flex;gap:calc(10px * var(--s));flex-wrap:wrap;
  margin-top:calc(10px * var(--s))}
.ro{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
  padding:calc(7px * var(--s)) calc(13px * var(--s));min-width:calc(150px * var(--s))}
.ro .k{font-size:calc(11.5px * var(--s));color:var(--sub)}
.ro .v{font-size:calc(24px * var(--s));font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.ro.val .v{color:var(--sin)}
body[data-mode="cos"] .ro.val .v{color:var(--cos)}
.hint{font-size:calc(12.5px * var(--s));color:var(--sub);margin:calc(9px * var(--s)) 0 0}
</style>
</head>
<body data-mode="sin">

<header class="bar">
  <h1>三角関数のグラフ</h1>
  <div class="tabs">
    <button data-m="sin" class="on">y = sin θ</button>
    <button data-m="cos">y = cos θ</button>
  </div>
  <div class="tools">
    <button class="tool" id="tgSize">文字を大きく</button>
    <button class="tool" id="tgSnap">代表角に止める</button>
    <button class="tool" id="btClear">なぞりを消す</button>
    <button class="tool" id="btReset">すべて初期化</button>
  </div>
</header>

<main>
  <canvas id="cv"></canvas>
  <div class="readout">
    <div class="ro"><div class="k">角 θ</div><div class="v" id="vDeg">-</div></div>
    <div class="ro"><div class="k">弧度法</div><div class="v" id="vRad">-</div></div>
    <div class="ro val"><div class="k" id="kVal">sin θ</div><div class="v" id="vVal">-</div></div>
  </div>
  <p class="hint" id="hint">左の円の上を指でなぞってください。動いた分だけ右にグラフが描かれます。</p>
</main>

<script>
"use strict";
const el = i => document.getElementById(i);
const cv = el('cv'), ctx = cv.getContext('2d');

/* canvas 内では CSS 変数を使えないので、:root と対応する色をここに持つ */
const C = {
  grid:'#e3e8ef', axis:'#8d9aab', tick:'#5a6675', circle:'#46536a',
  sin:'#0b62c4', cos:'#c2560a', guide:'#6b7787', trace:'#12181f',
  snapMark:'#12181f', point:'#ffffff',
  xaxis:'#d0202a', yaxis:'#3b4757', angle:'#12181f',
};

const TAU = Math.PI * 2;
const T_MIN = -Math.PI, T_MAX = 3 * Math.PI;   // 教科書と同じ範囲（2周分）

let mode = 'sin';
let theta = 0;                 // 画面に出す角（-π〜3π に収めたもの）
/* ドラッグの基準に使う角。theta は範囲で切り詰めるため、これを基準にすると
   端まで回したあと指を動かしたときに大きく逆走する。少し余裕を持たせた
   範囲で別に持ち、表示するときだけ切り詰める。 */
let thetaFree = 0;
let traceMin = 0, traceMax = 0; // なぞって通過した範囲。ここだけグラフを描く
let snapOn = true, sizeStep = 0, dragging = false;
let W = 0, H = 0, fs = 1;

/* 代表角。π/6 の倍数と π/4 の倍数（0°,30°,45°,60°,90°,120°,135°…）。
   π/12 を単位とした整数（分子）で持つ。
   角どうしの一致を a % (π/4) のような剰余で調べると、15π/12 が π/4 の5倍に
   わずかに届かず剰余が π/4 の直前になるため、225° を取りこぼす。 */
const SNAP_UNITS = (() => {
  const set = new Set();
  for (let k = -6; k <= 18; k++) set.add(k * 2);   // π/6 = 2 × (π/12)
  for (let k = -4; k <= 12; k++) set.add(k * 3);   // π/4 = 3 × (π/12)
  return [...set].sort((a, b) => a - b);
})();
const U = Math.PI / 12;
const SNAP_ANGLES = SNAP_UNITS.map(n => n * U)
  .filter(v => v >= T_MIN - 1e-9 && v <= T_MAX + 1e-9);
/* 1周ぶんの代表角（0〜2π未満）。円周に印を打つのに使う */
const CIRCLE_UNITS = [...new Set(SNAP_UNITS.map(n => ((n % 24) + 24) % 24))].sort((a, b) => a - b);

/* 分数表記のラジアン。代表角のときだけ π/6 のように表示する */
function radText(t) {
  const n = Math.round(t / (Math.PI / 12));
  if (Math.abs(t - n * Math.PI / 12) > 1e-6) return (t / Math.PI).toFixed(3) + 'π';
  if (n === 0) return '0';
  let num = n, den = 12;
  const g = (a, b) => b ? g(b, a % b) : Math.abs(a);
  const d = g(Math.abs(num), den);
  num /= d; den /= d;
  const sign = num < 0 ? '−' : '';
  num = Math.abs(num);
  const head = num === 1 ? 'π' : num + 'π';
  return den === 1 ? sign + head : sign + head + '/' + den;
}

/* ================= レイアウト =================
   単位円の半径とグラフの振幅を同じピクセル数にする。
   こうしないと円の点とグラフの点が同じ高さに来ず、点線が水平に引けない。 */
let cx, cy, r, gx, gy, ts;   // 円の中心・半径、グラフ原点、θ軸の倍率

function layout() {
  /* 円とグラフが近いと点線の途中が読み取りにくいので、間隔を広めに取る。
     左余白は cos のときに y 軸（左向き）の矢印とラベルが画面外に出ない幅が必要。
     軸は半径+24 まで伸ばし、そのさらに外側にラベルを置くため 60px 確保する。 */
  const padL = 60, padR = 26, gap = 64;
  const midY = H / 2;
  // 円の大きさは高さの制約と、横幅のうち円に割く分（およそ1/4）から決める
  r = Math.min(H / 2 - 52, (W - padL - padR - gap) * 0.23);
  r = Math.max(40, r);
  cx = padL + r;
  cy = midY;
  gx = cx + r + gap;
  gy = midY;
  ts = (W - gx - padR) / (T_MAX - T_MIN);   // θ 1ラジアンあたりのピクセル
}
function resize() {
  fs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
  const dpr = Math.min(devicePixelRatio || 1, 2), b = cv.getBoundingClientRect();
  W = b.width; H = b.height;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
  draw();
}

const X = t => gx + (t - T_MIN) * ts;        // θ → 画面x
const Y = v => gy - v * r;                   // 値 → 画面y（振幅＝円の半径）

/* 円周上の点。cos のときは座標軸を90°回して、cosθ が縦方向に来るようにする
   （教科書の「x座標の値を縦方向にとれるようにするため」と同じ）。 */
function circlePoint(t) {
  return mode === 'sin'
    ? { x: cx + Math.cos(t) * r, y: cy - Math.sin(t) * r }
    : { x: cx - Math.sin(t) * r, y: cy - Math.cos(t) * r };
}
const valueOf = t => mode === 'sin' ? Math.sin(t) : Math.cos(t);

/* ================= 描画 ================= */
function line(x1, y1, x2, y2, color, w, dash) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = w;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}

function drawCircle() {
  /* 座標軸。x 軸を赤にして、どちらが x でどちらが y か色で分かるようにする。
     cos のときは軸ごと90°回しているので、軸の向きと名前も一緒に回る。
     （sin: x は右・y は上 ／ cos: x は上・y は左） */
  const ax = r + 24;
  const axes = mode === 'sin'
    ? [{ dx: 1, dy: 0, name: 'x', col: C.xaxis }, { dx: 0, dy: -1, name: 'y', col: C.yaxis }]
    : [{ dx: 0, dy: -1, name: 'x', col: C.xaxis }, { dx: -1, dy: 0, name: 'y', col: C.yaxis }];

  for (const a of axes) {
    // 正負の両方向に伸ばし、正の側に矢印と軸名を置く
    line(cx - a.dx * ax, cy - a.dy * ax, cx + a.dx * ax, cy + a.dy * ax, a.col, 1.6);
    const ex = cx + a.dx * ax, ey = cy + a.dy * ax;
    ctx.save();
    ctx.fillStyle = a.col;
    ctx.beginPath();
    ctx.moveTo(ex + a.dx * 7, ey + a.dy * 7);
    ctx.lineTo(ex - a.dx * 4 - a.dy * 4, ey - a.dy * 4 + a.dx * 4);
    ctx.lineTo(ex - a.dx * 4 + a.dy * 4, ey - a.dy * 4 - a.dx * 4);
    ctx.closePath(); ctx.fill();
    ctx.font = 'bold ' + (14 * fs) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 軸の先の外側にラベルを置く。左向き・下向きでも画面に収まるよう寄せる
    const lx = Math.max(10, Math.min(W - 10, ex + a.dx * 18 - a.dy * 10));
    const ly = Math.max(10, Math.min(H - 10, ey + a.dy * 18 + a.dx * 10));
    ctx.fillText(a.name, lx, ly);
    ctx.restore();
  }

  ctx.strokeStyle = C.circle; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();

  // 原点
  ctx.fillStyle = C.tick; ctx.font = (13 * fs) + 'px sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText('O', cx - 6, cy + 4);

  // 代表角の位置に印を打つ。どこに吸い付くのかが見て分かるように
  if (snapOn) {
    ctx.fillStyle = C.snapMark;
    for (const n of CIRCLE_UNITS) {
      const q = circlePoint(n * U);
      ctx.beginPath(); ctx.arc(q.x, q.y, 3, 0, TAU); ctx.fill();
    }
  }

  // ±1 の目盛り。値が縦方向に対応している側に出す
  ctx.fillStyle = C.tick; ctx.font = (12 * fs) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('1', cx + 13, cy - r - 11);
  ctx.fillText('−1', cx - 16, cy + r + 12);

  drawAngleMark();

  // 動径
  const p = circlePoint(theta);
  line(cx, cy, p.x, p.y, mode === 'sin' ? C.sin : C.cos, 2.6);
}

/* 画面（canvas）上での角度。canvas は y が下向きなので数学の角と符号が逆になる。
   cos のときは軸を90°回しているぶんだけ基準がずれる。
   sin: θ=0 が右（0）／ cos: θ=0 が上（−π/2） */
const canvasAngle = t => (mode === 'sin' ? 0 : -Math.PI / 2) - t;

/* x 軸から動径までを弧で結び、矢印の先に度数を書く。
   「いま何度のところを見ているか」を円の中だけで読めるようにする。 */
function drawAngleMark() {
  if (Math.abs(theta) < 1e-9) return;
  const rad = Math.min(48, r * 0.42);
  const a0 = canvasAngle(0), a1 = canvasAngle(theta);

  ctx.save();
  // θ>0 は反時計回り。canvas では角度が減る向きなので counterclockwise を立てる
  ctx.strokeStyle = C.angle; ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(cx, cy, rad, a0, a1, theta > 0);
  ctx.stroke();

  // 弧の終点に矢印。回っている向きが分かる
  const ex = cx + Math.cos(a1) * rad, ey = cy + Math.sin(a1) * rad;
  const sgn = theta > 0 ? 1 : -1;
  const tx = Math.sin(a1) * sgn, ty = -Math.cos(a1) * sgn;   // 進む向きの単位ベクトル
  ctx.fillStyle = C.angle;
  ctx.beginPath();
  ctx.moveTo(ex + tx * 9, ey + ty * 9);
  ctx.lineTo(ex - tx * 3 - ty * 5, ey - ty * 3 + tx * 5);
  ctx.lineTo(ex - tx * 3 + ty * 5, ey - ty * 3 - tx * 5);
  ctx.closePath(); ctx.fill();

  // 度数は弧の外側、ちょうど真ん中あたりに置く
  const am = canvasAngle(theta / 2);
  const lx = cx + Math.cos(am) * (rad + 26), ly = cy + Math.sin(am) * (rad + 26);
  const d = theta * 180 / Math.PI;
  const txt = (Math.abs(d - Math.round(d)) < 1e-6 ? Math.round(d) : d.toFixed(1)) + '°';
  ctx.font = 'bold ' + (15 * fs) + 'px sans-serif';
  const w = ctx.measureText(txt).width;
  ctx.fillStyle = 'rgba(245,247,250,.92)';
  ctx.fillRect(lx - w / 2 - 5, ly - 11, w + 10, 22);
  ctx.fillStyle = C.angle;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, lx, ly);
  ctx.restore();
}

function drawGraphAxes() {
  // 横の基準線（y = 1, 0, −1）
  for (const v of [1, 0, -1]) {
    line(gx, Y(v), X(T_MAX), Y(v), v === 0 ? C.axis : C.grid, v === 0 ? 1.4 : 1);
  }
  ctx.fillStyle = C.tick; ctx.font = (12 * fs) + 'px sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('1', gx - 6, Y(1));
  ctx.fillText('−1', gx - 6, Y(-1));

  /* 目盛りは π/4 刻み。代表角の 45°系（π/4, 3π/4 …）も読めるようにする。
     ラベルは間隔が足りないと重なるので、前に置いた位置を覚えて間引く。
     π/2 の倍数は必ず出し、π/4 系は空きがあるときだけ出す。 */
  const marks = [];
  for (let k = -4; k <= 12; k++) {
    const t = k * Math.PI / 4;
    if (t < T_MIN - 1e-9 || t > T_MAX + 1e-9) continue;
    marks.push({ t, major: Math.abs(k % 2) < 1e-9 });
  }
  for (const m of marks) {
    line(X(m.t), Y(1), X(m.t), Y(-1), C.grid, m.major ? 1.2 : 1);
    line(X(m.t), Y(0) - (m.major ? 6 : 4), X(m.t), Y(0) + (m.major ? 6 : 4), C.axis, m.major ? 1.5 : 1.2);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  let lastRight = -Infinity;
  for (const m of marks.filter(x => x.major).concat(marks.filter(x => !x.major))) {
    if (Math.abs(m.t) < 1e-9) continue;   // 原点は O として別に書く
    ctx.font = (m.major ? 12 : 11) * fs + 'px sans-serif';
    const txt = radText(m.t), w = ctx.measureText(txt).width;
    const x = X(m.t);
    if (m.major) {
      ctx.fillStyle = C.tick;
      ctx.fillText(txt, x, Y(0) + 8);
      lastRight = Math.max(lastRight, x + w / 2);
    } else {
      // π/4 系は、隣のラベルと重ならないときだけ出す
      let clash = false;
      for (const o of marks.filter(z => z.major)) {
        ctx.font = (12 * fs) + 'px sans-serif';
        const ow = ctx.measureText(radText(o.t)).width;
        if (Math.abs(X(o.t) - x) < (ow + w) / 2 + 5) { clash = true; break; }
      }
      if (clash) continue;
      ctx.font = (11 * fs) + 'px sans-serif';
      ctx.fillStyle = C.tick;
      ctx.fillText(txt, x, Y(0) + 8);
    }
  }
  // 縦軸。値の 0 がどこかを示すため θ=0 の位置に引く（軸名は入れない）
  line(X(0), Y(1) - 10, X(0), Y(-1) + 10, C.axis, 1.6);

  // 原点は θ=0 と値0が交わるところ。グラフの左端ではない
  ctx.fillStyle = C.tick; ctx.font = (13 * fs) + 'px sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText('O', X(0) - 6, Y(0) + 5);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + (14 * fs) + 'px sans-serif';
  ctx.fillText('θ', X(T_MAX) + 6, Y(0));
}

/* なぞって通過した範囲だけ曲線を描く。自分で描いた感覚を残すため、
   最初から全体を描いてしまわない。 */
function drawTrace() {
  if (traceMax - traceMin < 1e-6) return;
  ctx.strokeStyle = mode === 'sin' ? C.sin : C.cos;
  ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  const step = (T_MAX - T_MIN) / 900;
  let first = true;
  for (let t = traceMin; t <= traceMax + 1e-9; t += step) {
    const px = X(t), py = Y(valueOf(t));
    first ? (ctx.moveTo(px, py), first = false) : ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function drawLink() {
  const p = circlePoint(theta);
  const v = valueOf(theta);
  const px = X(theta), py = Y(v);

  // 円の点 → グラフの点 をつなぐ水平の点線。値が縦方向に対応していることを示す
  line(p.x, p.y, px, py, C.guide, 1.6, [6, 5]);
  // グラフの点 → θ軸 の垂線
  line(px, py, px, Y(0), C.guide, 1.4, [4, 4]);
  // 円の中心から点への高さ（sin なら縦、cos も回転後は縦）
  line(cx, p.y, p.x, p.y, C.guide, 1.4, [4, 4]);

  const col = mode === 'sin' ? C.sin : C.cos;
  for (const q of [p, { x: px, y: py }]) {
    ctx.fillStyle = col; ctx.strokeStyle = C.point; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(q.x, q.y, 8, 0, TAU); ctx.fill(); ctx.stroke();
  }

  // 値のラベル
  ctx.font = 'bold ' + (13 * fs) + 'px sans-serif';
  ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const label = (mode === 'sin' ? 'sin θ = ' : 'cos θ = ') + v.toFixed(3);
  const w = ctx.measureText(label).width;
  const lx = px + 14 + w > W - 6 ? px - 14 - w : px + 14;
  ctx.fillStyle = 'rgba(255,255,255,.88)';
  ctx.fillRect(lx - 5, py - 11, w + 10, 22);
  ctx.fillStyle = col;
  ctx.fillText(label, lx, py);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawGraphAxes();
  drawTrace();
  drawCircle();
  drawLink();
}

/* ================= 状態 ================= */
function sync() {
  const v = valueOf(theta);
  el('vDeg').textContent = (theta * 180 / Math.PI).toFixed(1) + '°';
  el('vRad').textContent = radText(theta);
  el('kVal').textContent = mode === 'sin' ? 'sin θ' : 'cos θ';
  el('vVal').textContent = v.toFixed(3);
  draw();
}

function setTheta(t, extend) {
  thetaFree = Math.max(T_MIN - Math.PI, Math.min(T_MAX + Math.PI, t));
  theta = Math.max(T_MIN, Math.min(T_MAX, thetaFree));
  if (extend) {
    traceMin = Math.min(traceMin, theta);
    traceMax = Math.max(traceMax, theta);
  }
  sync();
}

/* 画面上の位置から角を求める。円は1周しかないので、そのままだと
   2π をまたいだ瞬間に値が飛ぶ。前回との差を ±π に収めて積み上げる。 */
function angleAt(px, py) {
  let a = mode === 'sin'
    ? Math.atan2(cy - py, px - cx)
    : Math.atan2(cx - px, cy - py);
  // 円は1周しかないので、そのままだと 2π をまたいだ瞬間に値が飛ぶ。
  // 前回との差を ±π に収めてから積み上げることで連続して回せる。
  let d = a - thetaFree;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return thetaFree + d;
}

function snap(t) {
  if (!snapOn) return t;
  // いちばん近いものを選ぶ。先に見つかった順だと 45° が 30° に吸われてしまう。
  // 判定は画面上の距離で行い、拡大率が変わっても感触を揃える
  let best = null, bestD = Infinity;
  for (const s of SNAP_ANGLES) {
    const d = Math.abs(t - s);
    if (d < bestD) { bestD = d; best = s; }
  }
  return bestD * ts < 13 ? best : t;
}

/* ================= 操作 ================= */
const loc = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };

cv.addEventListener('pointerdown', e => {
  const p = loc(e);
  cv.setPointerCapture(e.pointerId);
  dragging = true;
  // グラフ側を触ったときは、その θ へ直接移動できるようにする
  if (p.x > gx - 10) setTheta(snap(T_MIN + (p.x - gx) / ts), true);
  else setTheta(snap(angleAt(p.x, p.y)), true);
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const p = loc(e);
  if (p.x > gx - 10) setTheta(snap(T_MIN + (p.x - gx) / ts), true);
  else setTheta(snap(angleAt(p.x, p.y)), true);
});
function endDrag(e) { dragging = false; try { cv.releasePointerCapture(e.pointerId); } catch (_) {} }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => {
    mode = b.dataset.m;
    document.body.dataset.mode = mode;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    sync();
  };
});

el('tgSnap').classList.add('on');
el('tgSnap').onclick = () => {
  snapOn = !snapOn;
  el('tgSnap').classList.toggle('on', snapOn);
  el('tgSnap').textContent = snapOn ? '代表角に止める' : '自由に動かす';
  draw();
};
el('btClear').onclick = () => { traceMin = traceMax = theta; sync(); };
el('btReset').onclick = () => {
  theta = thetaFree = 0; traceMin = traceMax = 0; snapOn = true;
  el('tgSnap').classList.add('on'); el('tgSnap').textContent = '代表角に止める';
  sizeStep = 0; document.documentElement.style.setProperty('--s', 1);
  el('tgSize').textContent = '文字を大きく';
  resize();
};
const SIZES = [1, 1.3, 1.6], SIZE_LABEL = ['文字を大きく', '文字をもっと大きく', '文字を戻す'];
el('tgSize').onclick = () => {
  sizeStep = (sizeStep + 1) % SIZES.length;
  document.documentElement.style.setProperty('--s', SIZES[sizeStep]);
  el('tgSize').textContent = SIZE_LABEL[sizeStep];
  requestAnimationFrame(resize);
};

addEventListener('keydown', e => {
  const d = e.shiftKey ? Math.PI / 12 : Math.PI / 180;
  if (e.key === 'ArrowRight') { e.preventDefault(); setTheta(theta + d, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); setTheta(theta - d, true); }
  else if (e.key.toLowerCase() === 's') { e.preventDefault(); el('tgSnap').click(); }
});

addEventListener('resize', resize);
resize();
</script>
